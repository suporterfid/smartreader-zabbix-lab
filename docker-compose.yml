# Local Zabbix 7.0 LTS lab that monitors an Impinj R700 and its SmartReader CAP.
# Web UI: http://localhost:8080   (Zabbix image default login Admin / zabbix)
# Settings come from .env in this folder.
name: smartreader-zabbix-lab

x-db-env: &db-env
  DB_SERVER_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    environment:
      <<: *db-env
      ZBX_ENABLE_SNMP_TRAPS: "true"   # read the trap file written by zabbix-snmptraps
      ZBX_STARTPINGERS: "2"
      ZBX_STARTSNMPTRAPPER: "1"
    volumes:
      - snmptraps:/var/lib/zabbix/snmptraps
      - ./mibs:/var/lib/zabbix/mibs:ro
    ports:
      - "127.0.0.1:10051:10051"   # only needed for external agents or proxies
    depends_on:
      - postgres
      - zabbix-snmptraps
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    environment:
      <<: *db-env
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${PHP_TZ:-UTC}
    ports:
      - "127.0.0.1:8080:8080"     # web UI on this PC only; widen deliberately if you need to
    depends_on:
      - zabbix-server
    restart: unless-stopped

  # snmptrapd listens on UDP 1162 inside the container; the reader sends to UDP 162 on this PC.
  zabbix-snmptraps:
    image: zabbix/zabbix-snmptraps:alpine-7.0-latest
    ports:
      - "162:1162/udp"
    volumes:
      - snmptraps:/var/lib/zabbix/snmptraps
      - ./mibs:/var/lib/zabbix/mibs:ro
    restart: unless-stopped

volumes:
  pgdata:
  snmptraps:

# Docker Desktop rewrites the source address of the reader's traps to this network's gateway,
# so the subnet is pinned and the Zabbix host gets a trap-only SNMP interface on 172.31.67.1.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.67.0/24
          gateway: 172.31.67.1
