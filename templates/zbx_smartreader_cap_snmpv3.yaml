          type: SNMP_TRAP
          key: 'snmptrap["(netSnmpPlaypen\.7\.0\.|8072\.9999\.9999\.7\.0\.)4(\D|$)|mqttConnectFailed"]'
          delay: '0'
          value_type: LOG
          trends: '0'
          tags:
            - tag: component
              value: traps
            - tag: notification
              value: mqttConnectFailed
