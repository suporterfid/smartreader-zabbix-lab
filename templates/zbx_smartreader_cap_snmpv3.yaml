          value: 1.3.6.1.4.1.8072.9999.9999.7
          description: 'Root of SmartReader''s objects (provisional)'
        - macro: '{$SR.TEMP.MARGIN}'
          value: '5'
      valuemaps:
        - uuid: f48f5636eae74d9fa3cc07e77fe72982
          name: 'SmartReader collection status'
          mappings:
            - value: '0'
              newvalue: 'not collected yet'
            - value: '1'
              newvalue: ok
            - value: '2'
              newvalue: timeout
            - value: '3'
              newvalue: 'paused: the reader rejects the CAP''s credentials'
            - value: '4'
              newvalue: error
        - uuid: 77ec566d86bb4883b5c3cea4a291c940
          name: 'SmartReader RFID status'
          mappings:
            - value: '1'
              newvalue: enabled
            - value: '2'
              newvalue: disabled
            - value: '3'
              newvalue: other
        - uuid: 74c368406d2e44e8b202bd3d6ac5e945
          name: 'SmartReader yes/no'
          mappings:
            - value: '1'
              newvalue: 'yes'
            - value: '2'
              newvalue: 'no'
        - uuid: 6a893098181b49779102620a64fbd360
          name: Up/Down
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
  triggers:
    - uuid: 79a64c64ceaa4a6fb0852ba1f8d69b5b
      expression: 'last(/SmartReader CAP by SNMPv3/sr3.cpu.temp)>last(/SmartReader CAP by SNMPv3/sr3.cpu.temp.max)-{$SR.TEMP.MARGIN}'
      name: 'Reader CPU running hot (SNMPv3)'
      priority: WARNING
      dependencies:
        - name: 'SmartReader SNMPv3 agent not answering'
          expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
    - uuid: 111b321a98c14c91aa78770abc842f05
      expression: 'max(/SmartReader CAP by SNMPv3/sr3.wrong.digests,5m)>0 or max(/SmartReader CAP by SNMPv3/sr3.decryption.errors,5m)>0'
      name: 'SNMPv3 requests with a wrong key against SmartReader'
      priority: WARNING
      description: 'Someone is trying the agent with a wrong key; check who can reach UDP 1161.'
      dependencies:
        - name: 'SmartReader SNMPv3 agent not answering'
          expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
