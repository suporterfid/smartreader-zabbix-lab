          units: '%'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: c849a550d5c747b287e8317a3eba972e
          name: 'CAP managed heap'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.22.0'
          key: sr3.process.heap
          units: B
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: ce7d12e5292d4c979fac6b251dc0547a
          name: 'CAP resident memory'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.20.0'
          key: sr3.process.rss
          units: B
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: e8f8155bf84447a39c2fa4ae8878a03b
          name: 'CAP threads'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.23.0'
          key: sr3.process.threads
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: da89a4c1380e4031b16a2e49759d2aaf
          name: 'SNMPv3 requests dropped by the rate limit per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.11.0'
          key: sr3.rate.limited
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 064702b6edd64487af9a7400b376fd63
          name: 'Reader administrative status'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.5.2.1.0'
          key: sr3.reader.admin
          valuemap:
            name: 'SmartReader RFID status'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 347f7ae88d1f4f07960620cfc14ebc4e
          name: 'Reader operational status'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.5.2.2.0'
          key: sr3.reader.oper
          valuemap:
            name: 'SmartReader RFID status'
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 1f03daa1770944a4bbf9eb1e819e263f
              expression: 'last(/SmartReader CAP by SNMPv3/sr3.reader.oper)<>1'
              name: 'Reader RFID not operational (SNMPv3)'
              priority: HIGH
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: dea143834a314578810e6a5c4a43afaf
          name: 'SNMPv3 requests per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.1.0'
          key: sr3.requests
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 0457214d04d44f8086972243c5a6d580
          name: 'RFID statistics age'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.5.3.1.0'
          key: sr3.rfid.age
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 3432a70c3a3941b58f75cb0921b49bc2
              expression: 'last(/SmartReader CAP by SNMPv3/sr3.rfid.age)>300'
              name: 'SmartReader RFID statistics older than 5 minutes'
              priority: WARNING
              description: 'The CAP collects them every 60 s; see the collection status item for why.'
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: af0de731aeda4651b37ff71464ae1174
          name: 'RFID statistics collection'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.5.3.2.0'
          key: sr3.rfid.collection
          valuemap:
            name: 'SmartReader collection status'
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 23e6c05fd6284909888a9285e418b630
              expression: 'count(/SmartReader CAP by SNMPv3/sr3.rfid.collection,10m,"eq","1")=0'
              name: 'SmartReader cannot collect RFID statistics'
              priority: WARNING
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: 6c92e6d8151646dcab5f28d50b68740f
          name: 'RFID statistics since last reset'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.5.2.3.0'
          key: sr3.rfid.reset
          value_type: FLOAT
          units: uptime
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 8d3aea5605e64e668b28f3d239f31fd0
          name: 'SNMPv3 SET requests refused per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.12.0'
          key: sr3.set.refused
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 7bd5958e3f2344fbba54a2f615843348
          name: 'SNMPv3 agent description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: sr3.sysdescr
          delay: 1h
          value_type: CHAR
          trends: '0'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: eb68391505004478a6d627def57f792c
          name: 'SNMPv3 agent object ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: sr3.sysobjectid
          delay: 1h
          value_type: CHAR
          trends: '0'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 400812f761d04b0ea4622bec553c1f14
          name: 'SNMPv3 requests outside the time window per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.8.0'
          key: sr3.time.window
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 578c430814534808b0889116ee98ae4c
          name: 'SNMPv3 unknown user names per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.4.0'
          key: sr3.unknown.users
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 98229ddae45f4de4a43815b2efa0cd5b
          name: 'SNMPv3 wrong digests (authentication failures) per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.6.0'
          key: sr3.wrong.digests
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
      discovery_rules:
        - uuid: 2b58dd656d374500834979bdbabbbda1
          name: 'SmartReader antenna discovery'
          type: DEPENDENT
          key: sr3.antenna.discovery
          delay: '0'
          lifetime: 1d
          item_prototypes:
            - uuid: 4f6670e8e80240178d5ec16a5054ffe2
              name: 'Antenna {#SNMPINDEX} ({#ZONE}): administrative status'
              type: DEPENDENT
              key: 'sr3.antenna.admin[{#SNMPINDEX}]'
              delay: '0'
              valuemap:
                name: 'SmartReader RFID status'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '{$SR.SNMP.ROOT}.5.1.1.2.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: sr3.antennas.walk
              tags:
                - tag: antenna
                  value: '{#SNMPINDEX}'
                - tag: component
                  value: smartreader-antenna
            - uuid: 47b0ec7e39284d13b481167a57f41d8f
              name: 'Antenna {#SNMPINDEX} ({#ZONE}): enabled in SmartReader'
              type: DEPENDENT
              key: 'sr3.antenna.enabled[{#SNMPINDEX}]'
              delay: '0'
              valuemap:
                name: 'SmartReader yes/no'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '{$SR.SNMP.ROOT}.5.1.1.20.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: sr3.antennas.walk
              tags:
                - tag: antenna
                  value: '{#SNMPINDEX}'
                - tag: component
                  value: smartreader-antenna
            - uuid: 5b5dda0c8ee940eb8860ba131a678610
              name: 'Antenna {#SNMPINDEX} ({#ZONE}): time energized'
              type: DEPENDENT
              key: 'sr3.antenna.energized[{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
              units: uptime
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '{$SR.SNMP.ROOT}.5.1.1.6.{#SNMPINDEX}'
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: sr3.antennas.walk
              tags:
                - tag: antenna
                  value: '{#SNMPINDEX}'
                - tag: component
                  value: smartreader-antenna
            - uuid: 865b906578d743f5865f19f8d1a2a2ad
              name: 'Antenna {#SNMPINDEX} ({#ZONE}): failed tag erases'
              type: DEPENDENT
              key: 'sr3.antenna.erases.failed[{#SNMPINDEX}]'
              delay: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '{$SR.SNMP.ROOT}.5.1.1.19.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: sr3.antennas.walk
              tags:
                - tag: antenna
                  value: '{#SNMPINDEX}'
                - tag: component
                  value: smartreader-antenna
            - uuid: 78579dff2ae44f0abcb690501fa35b88
              name: 'Antenna {#SNMPINDEX} ({#ZONE}): tag erases'
              type: DEPENDENT
              key: 'sr3.antenna.erases[{#SNMPINDEX}]'
              delay: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '{$SR.SNMP.ROOT}.5.1.1.18.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: sr3.antennas.walk
              tags:
                - tag: antenna
                  value: '{#SNMPINDEX}'
                - tag: component
                  value: smartreader-antenna
            - uuid: 7980494a84eb4e928b7544e95bef1339
              name: 'Antenna {#SNMPINDEX} ({#ZONE}): failed inventories'
              type: DEPENDENT
              key: 'sr3.antenna.inventory.failed[{#SNMPINDEX}]'
              delay: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '{$SR.SNMP.ROOT}.5.1.1.9.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: sr3.antennas.walk
              tags:
                - tag: antenna
                  value: '{#SNMPINDEX}'
                - tag: component
                  value: smartreader-antenna
            - uuid: fc0cbec943384b749b302b5e3048dabf
              name: 'Antenna {#SNMPINDEX} ({#ZONE}): tags inventoried per second'
              type: DEPENDENT
              key: 'sr3.antenna.inventory.rate[{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
