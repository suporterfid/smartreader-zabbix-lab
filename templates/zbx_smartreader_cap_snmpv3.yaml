# SmartReader CAP by SNMPv3 - Zabbix 7.0 template
#
# Import: Data collection > Templates > Import. Then give the host an SNMP interface with
#   SNMPv3, port 1161, security level authPriv, and the agent's USM user, protocols and passphrases.
# If the same host also polls the reader's own agent (SNMP v2c, port 161), point this template's items at the
# SNMPv3 interface: Zabbix links them to the host's main SNMP interface.
#
# Collects the CAP's health, the agent's counters, the reader's RFID statistics and, through low-level
# discovery, one set of items per antenna port and per CAP component, plus a trap item and a trigger for the main
# informs of SMARTREADER-MIB. The CAP admin password and the reader's root password are not needed.
#
# The polled OIDs follow {$SR.SNMP.ROOT} (provisional, under Net-SNMP's netSnmpPlaypen, until Impinj allocates the
# arc). The trap items' keys spell the provisional root out and have to be edited along with the macro.
# Objects: docs/Snmp/MIB-REFERENCE.md in https://github.com/suporterfid/smartreader
# Source of truth: provision.py in https://github.com/suporterfid/smartreader-zabbix-lab
zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: ce535d7235794be1a5a6e52a1b9855a8
      name: Templates/SmartReader
  templates:
    - uuid: f4f295c94b9343e6bd1ae3ef5374900e
      template: 'SmartReader CAP by SNMPv3'
      name: 'SmartReader CAP by SNMPv3'
      description: 'SmartReader CAP health from the CAP''s own SNMPv3 agent (authPriv, read-only): CPU, memory, disk, temperatures, uptimes, MQTT, the antennas and components (low-level discovery), the agent''s counters and SmartReader''s SNMPv3 informs. The CAP admin password and the reader''s root password are not needed. The interface is SNMPv3 on UDP 1161. The OIDs sit under a provisional root until Impinj allocates the arc.'
      groups:
        - name: Templates/SmartReader
      items:
        - uuid: 5c5a944538414e1596f2e38b93132690
          name: 'Trap: capStarted'
          type: SNMP_TRAP
          key: 'snmptrap["(netSnmpPlaypen\.7\.0\.|8072\.9999\.9999\.7\.0\.)1(\D|$)|capStarted"]'
          delay: '0'
          value_type: LOG
          trends: '0'
          tags:
            - tag: component
              value: traps
            - tag: notification
              value: capStarted
          triggers:
            - uuid: 7fd919a0d57b43ffbf9667aa8b1124c8
              expression: 'nodata(/SmartReader CAP by SNMPv3/snmptrap["(netSnmpPlaypen\.7\.0\.|8072\.9999\.9999\.7\.0\.)1(\D|$)|capStarted"],15m)=0'
              name: 'SmartReader CAP started (inform)'
              priority: INFO
              description: 'Raised for 15 minutes after the inform capStarted arrives; close it manually once handled.'
              manual_close: 'YES'
        - uuid: 595d6b2593724c2f8f171213d921aa39
          name: 'Trap: mqttDisconnected'
          type: SNMP_TRAP
          key: 'snmptrap["(netSnmpPlaypen\.7\.0\.|8072\.9999\.9999\.7\.0\.)3(\D|$)|mqttDisconnected"]'
          delay: '0'
          value_type: LOG
          trends: '0'
          tags:
            - tag: component
              value: traps
            - tag: notification
              value: mqttDisconnected
          triggers:
            - uuid: 499dad4ce47a4a44ae2a2a4ff943d788
              expression: 'nodata(/SmartReader CAP by SNMPv3/snmptrap["(netSnmpPlaypen\.7\.0\.|8072\.9999\.9999\.7\.0\.)3(\D|$)|mqttDisconnected"],15m)=0'
              name: 'SmartReader CAP lost its MQTT broker (inform)'
              priority: WARNING
              description: 'Raised for 15 minutes after the inform mqttDisconnected arrives; close it manually once handled.'
              manual_close: 'YES'
        - uuid: dd2d38226314490eb6cd5a9c0cb6a247
