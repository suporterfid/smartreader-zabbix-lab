# SmartReader CAP by SNMPv3 (experimental) - Zabbix 7.0 template
#
# Import: Data collection > Templates > Import. Then give the host an SNMP interface with
#   SNMPv3, port 1161, security level authPriv, and the agent's USM user, protocols and passphrases.
# If the same host also polls the reader's own agent (SNMP v2c, port 161), point this template's items at the
# SNMPv3 interface: Zabbix links them to the host's main SNMP interface.
#
# EXPERIMENTAL: no released SmartReader CAP ships the agent yet, and its OIDs sit under a provisional root.
# The polled OIDs follow {$SR.SNMP.ROOT}; the trap item's key spells the provisional root out and has to be
# edited along with the macro when the final root is allocated.
# Source of truth: provision.py in https://github.com/suporterfid/smartreader-zabbix-lab
zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: d4080a0ddba9415f9d2fb2fd982960fd
      name: Templates/SmartReader
  templates:
    - uuid: d927b93ad0714a48afa8bc768ddf0054
      template: 'SmartReader CAP by SNMPv3'
      name: 'SmartReader CAP by SNMPv3 (experimental)'
      description: 'EXPERIMENTAL. SmartReader CAP health from the CAP''s own SNMPv3 agent (authPriv, read-only): CPU, memory, disk, temperatures, uptimes, MQTT, agent counters and SNMPv3 informs. Needs a SmartReader CAP that ships the agent; the object layout and root are provisional. The interface is SNMPv3 on UDP 1161.'
      groups:
        - name: Templates/SmartReader
      items:
        - uuid: b559fb7339a44026acbec1c8bbf2a371
          name: 'Trap: SmartReader SNMPv3 notification'
          type: SNMP_TRAP
          key: 'snmptrap["netSnmpPlaypen\.7\.0\.|8072\.9999\.9999\.7\.0\."]'
          delay: '0'
          value_type: LOG
          trends: '0'
          tags:
            - tag: component
              value: traps
          triggers:
            - uuid: 453a91e3cfc8432487f04623908ae6a8
              expression: 'nodata(/SmartReader CAP by SNMPv3/snmptrap["netSnmpPlaypen\.7\.0\.|8072\.9999\.9999\.7\.0\."],15m)=0'
              name: 'SmartReader SNMPv3 notification received'
              priority: INFO
              description: 'Raised for 15 minutes after an inform arrives; close it manually once handled.'
              manual_close: 'YES'
        - uuid: bbc22403231c460ea8df1cda116f16ad
          name: 'SNMPv3 agent uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: sr3.agent.uptime
          value_type: FLOAT
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: e69772e4755444e183c3542a76e1f426
              expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
              name: 'SmartReader SNMPv3 agent not answering'
              priority: AVERAGE
        - uuid: 792402a014144f5aa9fe08e4b09c6257
          name: 'CAP application uptime'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.5.0'
          key: sr3.app.uptime
          value_type: FLOAT
          units: uptime
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: e1ff34f2fa754163a936232f748cf0d6
              expression: 'last(/SmartReader CAP by SNMPv3/sr3.app.uptime)<600'
              name: 'CAP restarted (SNMPv3)'
              priority: WARNING
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: 52274b4dd8e14c46a30b54635242b48a
          name: 'CAP process CPU'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.1.0'
          key: sr3.cpu
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: b9edac7540c3434c8ac243f331efa965
          name: 'CPU temperature'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.6.0'
          key: sr3.cpu.temp
          value_type: FLOAT
          units: °C
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 9b7d33d8ee6a420e92a924e1a80a8907
          name: 'CPU temperature limit'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.7.0'
          key: sr3.cpu.temp.max
          value_type: FLOAT
          units: °C
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: e9e072fef8d74007a781ef3735c1ba48
          name: 'CPU temperature peak'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.8.0'
          key: sr3.cpu.temp.peak
          value_type: FLOAT
          units: °C
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 26f792ba89f14492bc0dbb7f8da1b432
          name: 'SNMPv3 decryption errors per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.7.0'
          key: sr3.decryption.errors
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 2b93251e71df43319c4b889646eba9bf
          name: 'CAP file system used'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.3.0'
          key: sr3.disk.pused
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: cf3183d4894b4dfaae4880e982d9f8e2
              expression: 'last(/SmartReader CAP by SNMPv3/sr3.disk.pused)>{$SR.DISK.MAX}'
              name: 'CAP file system above {$SR.DISK.MAX}% (SNMPv3)'
              priority: WARNING
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: b29d375738ba4238b885bc9bb41db779
          name: 'SNMPv3 engine boots'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.6.3.10.2.1.2.0
          key: sr3.engine.boots
          delay: 5m
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 17df9485502340c8b7e1d26609618bd0
              expression: 'change(/SmartReader CAP by SNMPv3/sr3.engine.boots)>0'
              name: 'SmartReader SNMP engine restarted'
              priority: INFO
              manual_close: 'YES'
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: dd8ec91f1cb942ff9dda114c680315b5
          name: 'SNMPv3 engine ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.6.3.10.2.1.1.0
          key: sr3.engine.id
          delay: 1h
          value_type: CHAR
          trends: '0'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: d278263434be4d448aeb485cf80d1415
          name: 'CAP process memory'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.2.0'
          key: sr3.memory
          value_type: FLOAT
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1048576'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: a9b198a03cc243d2a528a187fc8c122c
          name: 'CAP connected to MQTT broker'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.9.0'
          key: sr3.mqtt.connected
          valuemap:
            name: Up/Down
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 515592376b664442bfd7908aff9c3a27
              expression: 'max(/SmartReader CAP by SNMPv3/sr3.mqtt.connected,5m)=0'
              name: 'CAP lost the MQTT broker (SNMPv3)'
              priority: HIGH
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: f008a998d5384d2eb44f27f5c74a85fd
          name: 'CAP MQTT messages pending'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.10.0'
          key: sr3.mqtt.pending
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 7ac02e136936432691fa91fc43a6e275
              expression: 'min(/SmartReader CAP by SNMPv3/sr3.mqtt.pending,10m)>{$SR.PENDING.MAX}'
              name: 'CAP MQTT messages backing up (SNMPv3)'
              priority: AVERAGE
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: e408fdb84e5843f391680f50aaf12177
          name: 'Reader OS uptime'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.4.0'
          key: sr3.os.uptime
          value_type: FLOAT
          units: uptime
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 0148d558de03419cb741e3e5f1cd8e84
              expression: 'last(/SmartReader CAP by SNMPv3/sr3.os.uptime)<600'
              name: 'Reader rebooted (OS uptime via SNMPv3)'
              priority: WARNING
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: b463ded40f604511a8609c6b47261442
          name: 'CAP CPU, % of one core'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.21.0'
          key: sr3.process.cpu
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 844349e2a719439faa402030c125926b
          name: 'CAP managed heap'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.22.0'
          key: sr3.process.heap
          units: B
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: efb875a3ebf34a85a62089eedc289a30
          name: 'CAP resident memory'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.20.0'
          key: sr3.process.rss
          units: B
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 7cbfb7e9444443898b1b0e4858e77415
          name: 'CAP threads'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.23.0'
          key: sr3.process.threads
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 1955af16792649c3b507133aa945e71b
          name: 'SNMPv3 requests dropped by the rate limit per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.11.0'
          key: sr3.rate.limited
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: d27c3edf9842467bb9461d919365e98f
          name: 'SNMPv3 requests per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.1.0'
          key: sr3.requests
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 85a56a598c8c40fea727598343a0c94f
          name: 'SNMPv3 SET requests refused per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.12.0'
          key: sr3.set.refused
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: d8097f48b63f4d609d611e940284023d
          name: 'SNMPv3 agent description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: sr3.sysdescr
          delay: 1h
          value_type: CHAR
          trends: '0'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 46ebe5c72b3f46eaaaede60a9482dc51
          name: 'SNMPv3 agent object ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: sr3.sysobjectid
          delay: 1h
          value_type: CHAR
          trends: '0'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: aeaaa45e5aec46a1a5b1efa39b81fa8c
          name: 'SNMPv3 requests outside the time window per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.8.0'
          key: sr3.time.window
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 95e78481181f41108cec932470b1a5ea
          name: 'SNMPv3 unknown user names per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.4.0'
          key: sr3.unknown.users
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 9a11938b1bac46f29e18f358324ac7ae
          name: 'SNMPv3 wrong digests (authentication failures) per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.6.0'
          key: sr3.wrong.digests
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
      macros:
        - macro: '{$SR.DISK.MAX}'
          value: '85'
        - macro: '{$SR.PENDING.MAX}'
          value: '100'
        - macro: '{$SR.SNMP.ROOT}'
          value: 1.3.6.1.4.1.8072.9999.9999.7
          description: 'Root of SmartReader''s objects (provisional)'
        - macro: '{$SR.TEMP.MARGIN}'
          value: '5'
      valuemaps:
        - uuid: e1aa43af95594db79037db04d4e07733
          name: Up/Down
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
  triggers:
    - uuid: a64389a68f1d4fd99f2d37d139ef90b9
      expression: 'last(/SmartReader CAP by SNMPv3/sr3.cpu.temp)>last(/SmartReader CAP by SNMPv3/sr3.cpu.temp.max)-{$SR.TEMP.MARGIN}'
      name: 'Reader CPU running hot (SNMPv3)'
      priority: WARNING
      dependencies:
        - name: 'SmartReader SNMPv3 agent not answering'
          expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
    - uuid: 7ece338835e24176b7fc939938b89cd3
      expression: 'max(/SmartReader CAP by SNMPv3/sr3.wrong.digests,5m)>0 or max(/SmartReader CAP by SNMPv3/sr3.decryption.errors,5m)>0'
      name: 'SNMPv3 requests with a wrong key against SmartReader'
      priority: WARNING
      description: 'Someone is trying the agent with a wrong key; check who can reach UDP 1161.'
      dependencies:
        - name: 'SmartReader SNMPv3 agent not answering'
          expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
