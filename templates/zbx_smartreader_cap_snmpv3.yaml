# SmartReader CAP by SNMPv3 (experimental) - Zabbix 7.0 template
#
# Import: Data collection > Templates > Import. Then give the host an SNMP interface with
#   SNMPv3, port 1161, security level authPriv, and the agent's USM user, protocols and passphrases.
# If the same host also polls the reader's own agent (SNMP v2c, port 161), point this template's items at the
# SNMPv3 interface: Zabbix links them to the host's main SNMP interface.
#
# Collects the CAP's health, the agent's counters, the reader's RFID statistics and, through low-level
# discovery, one set of items per antenna port (`show rfid stat` figures and SmartReader's antenna settings).
#
# EXPERIMENTAL: no released SmartReader CAP ships the agent yet, and its OIDs sit under a provisional root.
# The polled OIDs follow {$SR.SNMP.ROOT}; the trap item's key spells the provisional root out and has to be
# edited along with the macro when the final root is allocated.
# Source of truth: provision.py in https://github.com/suporterfid/smartreader-zabbix-lab
zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: d4080a0ddba9415f9d2fb2fd982960fd
      name: Templates/SmartReader
  templates:
    - uuid: 0abafe92e6bd40b497eb8dd45446567c
      template: 'SmartReader CAP by SNMPv3'
      name: 'SmartReader CAP by SNMPv3 (experimental)'
      description: 'EXPERIMENTAL. SmartReader CAP health from the CAP''s own SNMPv3 agent (authPriv, read-only): CPU, memory, disk, temperatures, uptimes, MQTT, agent counters and SNMPv3 informs. Needs a SmartReader CAP that ships the agent; the object layout and root are provisional. The interface is SNMPv3 on UDP 1161.'
      groups:
        - name: Templates/SmartReader
      items:
        - uuid: b9bbf2ac21c94cf8b3d0ff562b7cc0aa
          name: 'Trap: SmartReader SNMPv3 notification'
          type: SNMP_TRAP
          key: 'snmptrap["netSnmpPlaypen\.7\.0\.|8072\.9999\.9999\.7\.0\."]'
          delay: '0'
          value_type: LOG
          trends: '0'
          tags:
            - tag: component
              value: traps
          triggers:
            - uuid: 55bf879439ae4394be5349eb3bfe824c
              expression: 'nodata(/SmartReader CAP by SNMPv3/snmptrap["netSnmpPlaypen\.7\.0\.|8072\.9999\.9999\.7\.0\."],15m)=0'
              name: 'SmartReader SNMPv3 notification received'
              priority: INFO
              description: 'Raised for 15 minutes after an inform arrives; close it manually once handled.'
              manual_close: 'YES'
        - uuid: 6b5dcaa2bb0646168096587088c078ed
          name: 'SNMPv3 agent uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: sr3.agent.uptime
          value_type: FLOAT
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 1be4bf559b1345dd86b96e921eb0e2ae
              expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
              name: 'SmartReader SNMPv3 agent not answering'
              priority: AVERAGE
        - uuid: a6816d0d21674308a862690b9a05bac6
          name: 'Antenna table (walk)'
          type: SNMP_AGENT
          snmp_oid: 'walk[{$SR.SNMP.ROOT}.5.1.1]'
          key: sr3.antennas.walk
          history: 1h
          value_type: TEXT
          trends: '0'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: e62ddce9510d4568b77addffcd80152e
          name: 'CAP application uptime'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.5.0'
          key: sr3.app.uptime
          value_type: FLOAT
          units: uptime
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: ca887fd062df4dd4ba88e94e463cc29d
              expression: 'last(/SmartReader CAP by SNMPv3/sr3.app.uptime)<600'
              name: 'CAP restarted (SNMPv3)'
              priority: WARNING
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: 8df907a372d54db9a2fbbb5c0938cfb5
          name: 'CAP process CPU'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.1.0'
          key: sr3.cpu
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 5fabaeabc3d246a69264ddbdf1d5cbf2
          name: 'CPU temperature'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.6.0'
          key: sr3.cpu.temp
          value_type: FLOAT
          units: °C
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: c690a88ec21c47f0bcf9bd59acf2eed7
          name: 'CPU temperature limit'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.7.0'
          key: sr3.cpu.temp.max
          value_type: FLOAT
          units: °C
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: c0f97fa0df91463d83f3ceb0772f00f2
          name: 'CPU temperature peak'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.8.0'
          key: sr3.cpu.temp.peak
          value_type: FLOAT
          units: °C
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: e3e4cf91ceb9434f829f764310edff40
          name: 'SNMPv3 decryption errors per second'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.3.7.0'
          key: sr3.decryption.errors
          value_type: FLOAT
          units: rps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 47f4677b2eaf4aa8981ba7146c335673
          name: 'CAP file system used'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.3.0'
          key: sr3.disk.pused
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 9847cfe570474da09af87da01c25924b
              expression: 'last(/SmartReader CAP by SNMPv3/sr3.disk.pused)>{$SR.DISK.MAX}'
              name: 'CAP file system above {$SR.DISK.MAX}% (SNMPv3)'
              priority: WARNING
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: 1289d12b27e5487491ddb5b2703a8cf7
          name: 'SNMPv3 engine boots'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.6.3.10.2.1.2.0
          key: sr3.engine.boots
          delay: 5m
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 91bc25a79e65443c9f9ab0b258fad1a5
              expression: 'change(/SmartReader CAP by SNMPv3/sr3.engine.boots)>0'
              name: 'SmartReader SNMP engine restarted'
              priority: INFO
              manual_close: 'YES'
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: ee5fb8b8ac694ada9863f5f6c55b4c2d
          name: 'SNMPv3 engine ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.6.3.10.2.1.1.0
          key: sr3.engine.id
          delay: 1h
          value_type: CHAR
          trends: '0'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: 71f0a6a9a20344039a56ee34c7cfc1c5
          name: 'CAP process memory'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.2.0'
          key: sr3.memory
          value_type: FLOAT
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1048576'
          tags:
            - tag: component
              value: smartreader-snmpv3
        - uuid: f2b29420b27044ef8be6ed18a4354435
          name: 'CAP connected to MQTT broker'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.9.0'
          key: sr3.mqtt.connected
          valuemap:
            name: Up/Down
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 40627e75ff00475688333c1783cf777a
              expression: 'max(/SmartReader CAP by SNMPv3/sr3.mqtt.connected,5m)=0'
              name: 'CAP lost the MQTT broker (SNMPv3)'
              priority: HIGH
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: ce45d7230c4d4b91a3d1c6b0961f1fc6
          name: 'CAP MQTT messages pending'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.10.0'
          key: sr3.mqtt.pending
          tags:
            - tag: component
              value: smartreader-snmpv3
          triggers:
            - uuid: 701675ab2777461f81665e048b2c2574
              expression: 'min(/SmartReader CAP by SNMPv3/sr3.mqtt.pending,10m)>{$SR.PENDING.MAX}'
              name: 'CAP MQTT messages backing up (SNMPv3)'
              priority: AVERAGE
              dependencies:
                - name: 'SmartReader SNMPv3 agent not answering'
                  expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
        - uuid: 78e8a7f10f184edc9e4d06b1c2f1b91a
          name: 'Reader OS uptime'
          type: SNMP_AGENT
          snmp_oid: '{$SR.SNMP.ROOT}.2.4.0'
          key: sr3.os.uptime
          value_type: FLOAT
