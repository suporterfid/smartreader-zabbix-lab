              opdata: '{ITEM.LASTVALUE1}'
              priority: AVERAGE
          master_item:
            key: sr3.antennas.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#ZONE}'
                - '{$SR.SNMP.ROOT}.2.5.1.1.21'
                - '0'
                - '{#CONFIGURED}'
                - '{$SR.SNMP.ROOT}.2.5.1.1.20'
                - '0'
        - uuid: e130994ebeec4036bdc3d065569651fe
          name: 'SmartReader component discovery'
          type: DEPENDENT
          key: sr3.component.discovery
          delay: '0'
          lifetime: 1d
          item_prototypes:
            - uuid: 293af086eb2441f3838462c3aaea34e6
              name: 'CAP component {#LABEL}: detail'
              type: DEPENDENT
              key: 'sr3.component.detail[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '{$SR.SNMP.ROOT}.2.4.1.1.5.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: sr3.components.walk
              tags:
                - tag: component
                  value: smartreader-component
                - tag: key
                  value: '{#KEY}'
            - uuid: 5ffe9b57945a43cf9e4efc5ff627ec53
              name: 'CAP component {#LABEL}: state'
              type: DEPENDENT
              key: 'sr3.component.state[{#SNMPINDEX}]'
              delay: '0'
              valuemap:
                name: 'SmartReader component state'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '{$SR.SNMP.ROOT}.2.4.1.1.4.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: sr3.components.walk
              tags:
                - tag: component
                  value: smartreader-component
                - tag: key
                  value: '{#KEY}'
              trigger_prototypes:
                - uuid: 2536cc6dbed94d1fbc94c039fffb8804
                  expression: 'last(/SmartReader CAP by SNMPv3/sr3.component.state[{#SNMPINDEX}])=3'
                  name: 'CAP component {#LABEL} is in error'
                  opdata: '{ITEM.LASTVALUE1}'
                  priority: AVERAGE
          master_item:
            key: sr3.components.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#KEY}'
                - '{$SR.SNMP.ROOT}.2.4.1.1.2'
                - '0'
                - '{#LABEL}'
                - '{$SR.SNMP.ROOT}.2.4.1.1.3'
                - '0'
      macros:
        - macro: '{$SR.DISK.MAX}'
          value: '85'
        - macro: '{$SR.PENDING.MAX}'
          value: '100'
        - macro: '{$SR.SNMP.ROOT}'
          value: 1.3.6.1.4.1.8072.9999.9999.7
          description: 'Root of SMARTREADER-MIB (provisional)'
        - macro: '{$SR.TEMP.MARGIN}'
          value: '5'
      valuemaps:
        - uuid: 545f0fb393634267be77ad57be18afc6
          name: 'SmartReader collection status'
          mappings:
            - value: '0'
              newvalue: 'not collected yet'
            - value: '1'
              newvalue: ok
            - value: '2'
              newvalue: timeout
            - value: '3'
              newvalue: 'paused: the reader rejects the CAP''s credentials'
            - value: '4'
              newvalue: error
        - uuid: 4e9c185df4054bd5997adf3aa47b4b1a
          name: 'SmartReader component state'
          mappings:
            - value: '1'
              newvalue: OK
            - value: '2'
              newvalue: Warning
            - value: '3'
              newvalue: Error
            - value: '4'
              newvalue: 'Off'
            - value: '5'
              newvalue: Amber
        - uuid: f623989a7f1b42bcbdba68f24f228e48
          name: 'SmartReader RFID status'
          mappings:
            - value: '1'
              newvalue: enabled
            - value: '2'
              newvalue: disabled
            - value: '3'
              newvalue: other
        - uuid: ab9e05cb8cdd44cda1bee0ce1219b153
          name: 'SmartReader yes/no'
          mappings:
            - value: '1'
              newvalue: 'yes'
            - value: '2'
              newvalue: 'no'
        - uuid: 1224cfce28744ce788427cabf3fdcb12
          name: Up/Down
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
  triggers:
    - uuid: dc6d7e918d134bc29dd56e080c46a3be
      expression: 'last(/SmartReader CAP by SNMPv3/sr3.cpu.temp)>last(/SmartReader CAP by SNMPv3/sr3.cpu.temp.max)-{$SR.TEMP.MARGIN}'
      name: 'Reader CPU running hot (SNMPv3)'
      priority: WARNING
      dependencies:
        - name: 'SmartReader SNMPv3 agent not answering'
          expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
    - uuid: d47c7ba1d7244237ad683d1c6c824e75
      expression: 'max(/SmartReader CAP by SNMPv3/sr3.wrong.digests,5m)>0 or max(/SmartReader CAP by SNMPv3/sr3.decryption.errors,5m)>0'
      name: 'SNMPv3 requests with a wrong key against SmartReader'
      priority: WARNING
      description: 'Someone is trying the agent with a wrong key; check who can reach UDP 1161.'
      dependencies:
        - name: 'SmartReader SNMPv3 agent not answering'
          expression: 'nodata(/SmartReader CAP by SNMPv3/sr3.agent.uptime,5m)=1'
